<!DOCTYPE html>
<html>

<head>

    <title>ClaimGuard Register</title>

    <link rel="stylesheet" href="css/register.css">

</head>

<body>

    <div class="container">

        <h1>ClaimGuard</h1>

        <h2>Register</h2>

        <form id="registerForm">

            <label for="name">Name:</label>

            <input
                type="text"
                id="name"
                required
            >

            <label for="email">Email:</label>

            <input
                type="email"
                id="email"
                required
            >
            <label for="password">Password:</label>

<div class="password-box">

    <input
        type="password"
        id="password"
        required
    >

    <button
        type="button"
        id="togglePassword"
        class="eye-button">

        <svg
            id="eyeIcon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24">

            <path
                d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
            />

            <circle
                cx="12"
                cy="12"
                r="3"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
            />

        </svg>

    </button>

</div>

            <p class="forgot-password">
                <a href="forgot-password.html">
                    Forgot Password?
                </a>
            </p>

            <button type="submit">
                Register
            </button>

        </form>

        <p>
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

    <script src="js/app.js"></script>

</body>

</html>
