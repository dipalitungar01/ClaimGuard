<!DOCTYPE html>
<html>

<head>

    <title>My Claims - ClaimGuard</title>

    <link rel="stylesheet" href="css/claims.css">

</head>


<body>


    <div class="claims-container">


        <!-- Header -->

        <div class="page-header">

            <h1>ClaimGuard</h1>

            <p>Insurance Claim Risk Analysis</p>

        </div>


        <div class="title-section">

            <h2>My Claims</h2>

            <p>
                View your submitted claims and risk information
            </p>

        </div>


        <!-- View Claims Button -->

        <button
            class="view-button"
            onclick="loadClaims()"
        >

            View Claims

        </button>


        <!-- Claims -->

        <div id="claims">

        </div>


        <!-- Back Button -->

        <button
            class="back-button"
            onclick="goBack()"
        >

            ← Back to Dashboard

        </button>


    </div>


    <script>


        function loadClaims() {


            fetch("http://127.0.0.1:8000/claims/")


            .then(function(response) {

                return response.json();

            })


            .then(function(data) {


                console.log(data);


                let output = "";


                if (data.length === 0) {

                    output = `

                        <div class="no-claims">

                            <h3>No Claims Found</h3>

                            <p>
                                You have not submitted any claims yet.
                            </p>

                        </div>

                    `;

                }


                for (let i = 0; i < data.length; i++) {


                    let status = data[i].status;


                    let statusClass =
                        status.replaceAll(" ", "-");


                    let fraudScore =
                        data[i].fraud_score;


                    let riskLevel = 
                        data[i].risk_level;


                    output += `

                        <div class="claim-card">


                            <div class="claim-header">

                                <h3>
                                    Claim ${data[i].claim_number}
                                </h3>

                                <span
                                    class="status ${statusClass}"
                                >

                                    ${status}

                                </span>

                            </div>


                            <div class="claim-details">


                                <div class="detail">

                                    <span>
                                        Claim Amount
                                    </span>

                                    <strong>
                                        ₹${Number(
                                            data[i].claim_amount
                                        ).toLocaleString("en-IN")}
                                    </strong>

                                </div>


                                <div class="detail">

                                    <span>
                                        Fraud Score
                                    </span>

                                    <strong>
                                        ${fraudScore} / 100
                                    </strong>

                                </div>


                                <div class="detail">

                                    <span>
                                        Risk Level
                                    </span>

                                    <strong class="risk-text">

                                        ${riskLevel}

                                    </strong>

                                </div>


                            </div>


                        </div>

                    `;

                }


                document.getElementById("claims").innerHTML =
                    output;


            })


            .catch(function(error) {


                console.log(error);


                alert(
                    "Cannot connect to ClaimGuard server."
                );


            });

        }



        function goBack() {

            window.location.href = "dashboard.html";

        }



        // Load claims automatically

        loadClaims();


    </script>


</body>

</html>
