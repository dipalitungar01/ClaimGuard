<!DOCTYPE html>
<html>

<head>

    <title>ClaimGuard Forgot Password</title>

    <link rel="stylesheet" href="css/login.css">

</head>

<body>

    <div class="login-container">

        <h1>ClaimGuard</h1>

        <h2>Forgot Password</h2>

        <form id="forgotPasswordForm">

            <label for="email">Email:</label>

            <input
                type="email"
                id="email"
                required
            >

            <button type="submit">
                Send Reset Link
            </button>

        </form>

        <p>

            Remember your password?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

    <script src="js/app.js"></script>

</body>

</html>s
