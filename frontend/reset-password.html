<!DOCTYPE html>
<html>

<head>

    <title>ClaimGuard Reset Password</title>

    <link rel="stylesheet" href="css/login.css">

</head>

<body>

    <div class="login-container">

        <h1>ClaimGuard</h1>

        <h2>Reset Password</h2>

        <form id="resetPasswordForm">

            <!-- Email -->

            <label for="email">Email:</label>

            <input
                type="email"
                id="email"
                required
            >


            <!-- New Password -->

            <label for="newPassword">New Password:</label>

            <input
                type="password"
                id="newPassword"
                required
            >


            <!-- Confirm Password -->

            <label for="confirmPassword">Confirm Password:</label>

            <input
                type="password"
                id="confirmPassword"
                required
            >


            <!-- Reset button -->

            <button type="submit">
                Reset Password
            </button>

        </form>


        <p>

            Remember your password?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>


    <script src="js/app.js"></script>

</body>

</html>
